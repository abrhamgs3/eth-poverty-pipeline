[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-poverty-pipeline"
version = "1.0.0"
description = "AI-screened poverty annotation to econometric bias correction pipeline (Ethiopia ESS panel)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.6",
    "scikit-learn>=1.2",
    "pydantic>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
openai = ["openai>=1.0"]

[project.scripts]
eth-poverty-pipeline = "eth_poverty_pipeline.pipeline:main"

[tool.setuptools.packages.find]
include = ["eth_poverty_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
