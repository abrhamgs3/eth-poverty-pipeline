name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI (no access to the real ESS panel here, so this exercises the synthetic fallback)
        run: python main.py --data-path does_not_exist.parquet --n-bootstrap 30
